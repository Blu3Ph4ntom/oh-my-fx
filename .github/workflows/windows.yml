name: Windows

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Windows native build (ReleaseSafe)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          cache-key: windows-native-ReleaseSafe

      - name: Check formatting
        run: zig fmt --check src/

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline

      - name: Smoke test fresh binary
        shell: pwsh
        run: |
          $env:FX_BENCH = "1"
          & ./zig-out/bin/fx.exe help
          if ($LASTEXITCODE -ne 0) { throw "fx help (bench) failed" }

      - name: Stage omfx.exe alongside fx.exe
        shell: pwsh
        run: |
          Copy-Item ./zig-out/bin/fx.exe ./zig-out/bin/omfx.exe -Force
          $env:FX_BENCH = "1"
          & ./zig-out/bin/omfx.exe help
          if ($LASTEXITCODE -ne 0) { throw "omfx help (bench) failed" }

      - name: Bounded omfx surface smoke
        shell: pwsh
        run: |
          $exe = (Resolve-Path "./zig-out/bin/omfx.exe").Path

          function Invoke-BoundedOmfx([string]$name, [string[]]$arguments) {
            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $exe
            $startInfo.WorkingDirectory = (Get-Location).Path
            $startInfo.UseShellExecute = $false
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            $startInfo.Environment["FX_BENCH"] = "1"
            foreach ($argument in $arguments) { [void]$startInfo.ArgumentList.Add($argument) }

            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            [void]$process.Start()
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(30 * 1000)) {
              try { $process.Kill($true) } catch { $process.Kill() }
              $process.WaitForExit()
              $stderr = $stderrTask.GetAwaiter().GetResult().Trim()
              if ($stderr.Length -gt 4096) { $stderr = $stderr.Substring(0, 4096) }
              throw "$name timed out after 30 seconds (stderr=$stderr)"
            }

            $stdout = $stdoutTask.GetAwaiter().GetResult()
            $stderr = $stderrTask.GetAwaiter().GetResult()
            if ($process.ExitCode -ne 0) {
              $diagnostic = ($stderr + $stdout).Trim()
              if ($diagnostic.Length -gt 4096) { $diagnostic = $diagnostic.Substring(0, 4096) }
              throw "$name exited with code $($process.ExitCode) (diagnostic=$diagnostic)"
            }
            if (-not [string]::IsNullOrWhiteSpace($stderr)) {
              throw "$name wrote to stderr: $stderr"
            }
            return $stdout
          }

          $version = Invoke-BoundedOmfx "omfx version" @("--version")
          $help = Invoke-BoundedOmfx "omfx help" @("help")
          if ([string]::IsNullOrWhiteSpace($version) -or $version -notmatch "^\d+\.\d+\.\d+") {
            throw "omfx version output was not a semantic version"
          }
          if ([string]::IsNullOrWhiteSpace($help) -or $help -notmatch "Usage:" -or $help -notmatch "omfx") {
            throw "omfx help output was incomplete"
          }
          if ($version -match "�|≡¥Æ|Ã") { throw "omfx version output contains mojibake" }
          if ($help -match "�|≡¥Æ") { throw "omfx help output contains mojibake" }
          Write-Output "Bounded omfx version/help surface smoke passed"

      - name: Bounded omfx ConPTY smoke
        shell: pwsh
        timeout-minutes: 2
        env:
          FX_SKIP_ONBOARDING: "1"
          FX_DISABLE_KEYCHAIN: "1"
          FX_AUTO_UPGRADE: "0"
          FX_NO_OPEN_BROWSER: "1"
          NO_COLOR: "1"
        run: |
          & pwsh -NoProfile -File ./scripts/windows/omfx-conpty-smoke.ps1 `
            -Executable ./zig-out/bin/omfx.exe `
            -TimeoutSeconds 15
          if ($LASTEXITCODE -ne 0) { throw "omfx ConPTY smoke failed" }

      - name: Smoke test OpenCode Go with omfx.exe
        shell: pwsh
        timeout-minutes: 10
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OPENCODE_GO_API_KEY)) {
            throw "OPENCODE_GO_API_KEY Actions secret is not configured"
          }

          $smokeHome = Join-Path $env:RUNNER_TEMP "fx-opencode-go-home"
          $fxProfile = Join-Path $smokeHome ".fx"
          New-Item -ItemType Directory -Force -Path $fxProfile | Out-Null
          $env:HOME = $smokeHome
          [System.IO.File]::WriteAllText(
            (Join-Path $fxProfile "settings.json"),
            '{"provider":"opencode_go"}',
            [System.Text.UTF8Encoding]::new($false)
          )

          function Invoke-BoundedFx([string]$name, [string[]]$arguments, [int]$timeoutSeconds) {
            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = (Resolve-Path "./zig-out/bin/omfx.exe").Path
            $startInfo.WorkingDirectory = (Get-Location).Path
            $startInfo.UseShellExecute = $false
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            foreach ($argument in $arguments) { [void]$startInfo.ArgumentList.Add($argument) }

            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            [void]$process.Start()
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit($timeoutSeconds * 1000)) {
              try { $process.Kill($true) } catch { $process.Kill() }
              $process.WaitForExit()
              $timeoutStderr = $stderrTask.GetAwaiter().GetResult().Trim()
              if ($timeoutStderr.Length -gt 4096) { $timeoutStderr = $timeoutStderr.Substring(0, 4096) }
              $trace = Join-Path $env:RUNNER_TEMP "fx-opencode-go.trace"
              $traceTail = if (Test-Path -LiteralPath $trace) {
                (Get-Content -LiteralPath $trace -Tail 80 -ErrorAction SilentlyContinue) -join "`n"
              } else {
                ""
              }
              $traceTail = $traceTail -replace "\r?\n", " | "
              throw "$name timed out after $timeoutSeconds seconds (stderr=$timeoutStderr trace=$traceTail)"
            }
            [pscustomobject]@{
              ExitCode = $process.ExitCode
              Stdout = $stdoutTask.GetAwaiter().GetResult()
              Stderr = $stderrTask.GetAwaiter().GetResult()
            }
          }

          Write-Output "OpenCode Go model catalog request started"
          $modelsResult = Invoke-BoundedFx "OpenCode Go model catalog" @("models", "--json") 60
          $modelsJson = $modelsResult.Stdout
          $modelsExit = $modelsResult.ExitCode
          $modelsStderr = $modelsResult.Stderr
          if ($modelsExit -ne 0) {
            $modelsDiagnostic = ($modelsStderr + $modelsJson).Trim()
            if ($modelsDiagnostic.Length -gt 2048) { $modelsDiagnostic = $modelsDiagnostic.Substring(0, 2048) }
            throw "OpenCode Go model catalog failed with exit code $modelsExit (diagnostic=$modelsDiagnostic)"
          }
          if (-not [string]::IsNullOrWhiteSpace($modelsStderr)) { throw "OpenCode Go model catalog wrote to stderr: $modelsStderr" }
          Write-Output "OpenCode Go model catalog request returned successfully"

          $models = $modelsJson | ConvertFrom-Json
          if ($models.count -lt 1 -or $null -eq $models.ids -or [string]::IsNullOrWhiteSpace([string]$models.ids[0])) {
            throw "OpenCode Go returned no models"
          }
          $preferredModels = @("glm-5.3-flash", "deepseek-v4-flash", "mimo-v2.5", "omen-alpha")
          $selectedModel = $preferredModels |
            Where-Object { $models.ids -contains $_ } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace([string]$selectedModel)) {
            $selectedModel = [string]$models.ids[0]
          }
          $settings = [ordered]@{
            provider = "opencode_go"
            model = $selectedModel
            max_agent_steps = 1
            first_call_tool_choice = "none"
            permission_mode = "yolo"
            yolo_acknowledged = $true
          } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText(
            (Join-Path $fxProfile "settings.json"),
            $settings,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Output "OpenCode Go chat request started with model $selectedModel"
          $askResult = Invoke-BoundedFx "OpenCode Go chat smoke" @("ask", "--no-save", "--json", "--yolo", "--", "Reply with exactly FX_OPENCODE_GO_SMOKE.") 120
          $askJson = $askResult.Stdout
          $askExit = $askResult.ExitCode
          $askStderr = $askResult.Stderr
          if ($askExit -ne 0) {
            $askDiagnostic = ($askStderr + $askJson).Trim()
            if ($askDiagnostic.Length -gt 2048) { $askDiagnostic = $askDiagnostic.Substring(0, 2048) }
            throw "OpenCode Go chat smoke failed with exit code $askExit (diagnostic=$askDiagnostic)"
          }
          if (-not [string]::IsNullOrWhiteSpace($askStderr)) { throw "OpenCode Go chat smoke wrote to stderr: $askStderr" }

          $ask = $askJson | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$ask.output)) { throw "OpenCode Go chat smoke returned empty output" }
          if ([string]$ask.model -ne $selectedModel) { throw "OpenCode Go chat used an unexpected model" }
          Write-Output "OpenCode Go catalog and chat smoke passed with model $selectedModel"

      - name: Verify Windows artifact payloads
        shell: pwsh
        run: |
          $fx = Get-Item -LiteralPath "./zig-out/bin/fx.exe"
          $omfx = Get-Item -LiteralPath "./zig-out/bin/omfx.exe"
          if ($fx.Length -le 0 -or $omfx.Length -le 0) { throw "Windows artifact is empty" }
          $fxHash = (Get-FileHash -LiteralPath $fx.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $omfxHash = (Get-FileHash -LiteralPath $omfx.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "fx.exe size=$($fx.Length) sha256=$fxHash"
          Write-Output "omfx.exe size=$($omfx.Length) sha256=$omfxHash"
          if ($fx.Length -ne $omfx.Length -or $fxHash -ne $omfxHash) {
            throw "fx.exe and omfx.exe payloads differ"
          }

      - name: Upload fx.exe
        uses: actions/upload-artifact@v4
        with:
          name: fx-windows-x86_64
          path: zig-out/bin/fx.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload omfx.exe
        uses: actions/upload-artifact@v4
        with:
          name: omfx-windows-x86_64
          path: zig-out/bin/omfx.exe
          if-no-files-found: error
          retention-days: 14

      - name: Download uploaded fx.exe for verification
        uses: actions/download-artifact@v4
        with:
          name: fx-windows-x86_64
          path: ${{ runner.temp }}/omfx-artifact-check/fx

      - name: Download uploaded omfx.exe for verification
        uses: actions/download-artifact@v4
        with:
          name: omfx-windows-x86_64
          path: ${{ runner.temp }}/omfx-artifact-check/omfx

      - name: Verify downloaded Windows artifacts
        shell: pwsh
        run: |
          $fx = Get-Item -LiteralPath "./zig-out/bin/fx.exe"
          $omfx = Get-Item -LiteralPath "./zig-out/bin/omfx.exe"
          $downloadedFx = Get-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "omfx-artifact-check\fx\fx.exe")
          $downloadedOmfx = Get-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "omfx-artifact-check\omfx\omfx.exe")
          $expectedFxHash = (Get-FileHash -LiteralPath $fx.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedOmfxHash = (Get-FileHash -LiteralPath $omfx.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualFxHash = (Get-FileHash -LiteralPath $downloadedFx.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualOmfxHash = (Get-FileHash -LiteralPath $downloadedOmfx.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "downloaded fx.exe size=$($downloadedFx.Length) sha256=$actualFxHash"
          Write-Output "downloaded omfx.exe size=$($downloadedOmfx.Length) sha256=$actualOmfxHash"
          if ($downloadedFx.Length -ne $fx.Length -or $actualFxHash -ne $expectedFxHash) {
            throw "downloaded fx.exe differs from the build payload"
          }
          if ($downloadedOmfx.Length -ne $omfx.Length -or $actualOmfxHash -ne $expectedOmfxHash) {
            throw "downloaded omfx.exe differs from the build payload"
          }

  test:
    name: Windows unit tests
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          cache-key: windows-test

      # Fast signal only: the full suite hangs past the 60-min cap with zero
      # streamed output. This small test root keeps imports under the src
      # module path while avoiding unrelated build-only dependencies, and
      # --test-filter narrows execution to the changed unit tests. Full suite
      # stays a future parity job; every filter below is named and required.
      - name: Run unit tests
        run: |
          zig test -lc src/test_root.zig --test-filter "omfx identity contract"
          zig test -lc src/test_root.zig --test-filter "Night Signal palette"
          zig test -lc src/test_root.zig --test-filter "getenvProduct prefers"
          zig test -lc src/test_root.zig --test-filter "ui preference parser"
          zig test -lc src/test_root.zig --test-filter "settings catalog exposes UI preference controls"
          zig test -lc src/test_root.zig --test-filter "settings catalog cycles UI preferences"
          zig test -lc src/test_root.zig --test-filter "OMFX_HOME overrides legacy profile root"
          zig test -lc src/test_root.zig --test-filter "go endpoint accepts"
          zig test -lc src/test_root.zig --test-filter "route guard distinguishes"
          zig test -lc src/test_root.zig --test-filter "Go model routes cover"
          zig test -lc src/test_root.zig --test-filter "Go route request bodies"
          zig test -lc src/test_root.zig --test-filter "Go catalog parser"
          zig test -lc src/test_root.zig --test-filter "converts gateway tools"
          zig test -lc src/test_root.zig --test-filter "omits tools for none"
          zig test -lc src/test_root.zig --test-filter "Windows raw input mode"
          zig test -lc src/test_root.zig --test-filter "terminal decoder key matrix"
          zig test -lc src/test_root.zig --test-filter "terminal decoder preserves CR and LF"
          zig test -lc src/test_root.zig --test-filter "terminal decoder coalesces CRLF"
          zig test -lc src/test_root.zig --test-filter "bare Escape emits once"
          zig test -lc src/test_root.zig --test-filter "Windows modifier and Kitty key forms"
          zig test -lc src/test_root.zig --test-filter "protocol aliases normalize once"
          zig test -lc src/test_root.zig --test-filter "event loop commits once"
          zig test -lc src/test_root.zig --test-filter "event loop coalesces resize and activity"
          zig test -lc src/test_root.zig --test-filter "event loop settles a facts-only"
          zig test -lc src/test_root.zig --test-filter "interaction contract maps common navigation keys"
          zig test -lc src/test_root.zig --test-filter "interaction contract keeps surface-specific cancel behavior"
          zig test -lc src/test_root.zig --test-filter "settings menu Enter commits selected option"
          zig test -lc src/test_root.zig --test-filter "settings menu Escape restores previous surface"
          zig test -lc src/test_root.zig --test-filter "provider picker arrows move selection"
          zig test -lc src/test_root.zig --test-filter "question freeform Enter submits"
          zig test -lc src/test_root.zig --test-filter "reduced motion removes shimmer"
          zig test -lc src/test_root.zig --test-filter "no color keeps approval decisions"
          zig test -lc src/test_root.zig --test-filter "light palette keeps primary text readable"
          zig test -lc src/test_root.zig --test-filter "alternate screen"
          zig test -lc src/test_root.zig --test-filter "footer tiny widths"
          zig test -lc src/test_root.zig --test-filter "provider picker exposes OpenCode Go"
          zig test -lc src/test_root.zig --test-filter "provider credential guidance names"
          zig test -lc src/test_root.zig --test-filter "auth status snapshot names the selected OpenCode Go credential"
          zig test -lc src/test_root.zig --test-filter "Codex onboarding sign-in enters the provider activation flow"
          zig test -lc src/test_root.zig --test-filter "app_input_runtime provider picker routes terminal actions"
          zig test -lc src/test_root.zig --test-filter "app_input_runtime provider picker Escape"
          zig test -lc src/test_root.zig --test-filter "app_input_runtime provider Enter forms close once"
          zig test -lc src/test_root.zig --test-filter "app_input_runtime full transcript owns Enter"
          zig test -lc src/test_root.zig --test-filter "app_input_runtime auth Escape restores"
          zig test -lc src/test_root.zig --test-filter "app_input_runtime question Enter owns"
          zig test -lc src/test_root.zig --test-filter "app_input_runtime standalone LF after submit"
          zig test -lc src/test_root.zig --test-filter "app_input_runtime resize then input"
          zig test -lc src/test_root.zig --test-filter "every alternate screen owner restores"
          zig test -lc src/test_root.zig --test-filter "failed terminal takeover leave"
          zig test -lc src/test_root.zig --test-filter "ChatGPT browser authorization URL"
          zig test -lc src/test_root.zig --test-filter "Codex request originator"
          zig test -lc src/test_root.zig --test-filter "login failure notices identify their provider"
          zig test -lc src/test_root.zig --test-filter "Windows browser callback readiness sees"
          zig test -lc src/test_root.zig --test-filter "Windows browser callback wait times out"
          zig test -lc src/test_root.zig --test-filter "Windows fixed callback ports reject"
          zig test -lc src/test_root.zig --test-filter "browser login cancellation releases callback listener"
          zig test -lc src/test_root.zig --test-filter "loadSkills loads managed skills under HOME"
